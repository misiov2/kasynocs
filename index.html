<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>HazardCS – Symulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h1>HazardCS</h1>
    <div class="wallet">Portfel: <span id="wallet">0</span> zł</div>
    <button id="redeem-code">Użyj kodu FREE</button>
  </div>

  <div class="cases">
    <div class="case" data-price="2">
      <h2>Skrzynka 1 – 2 zł</h2>
      <button class="open-btn">Otwórz</button>
      <div class="spinner"></div>
    </div>
    <div class="case" data-price="10">
      <h2>Skrzynka 2 – 10 zł</h2>
      <button class="open-btn">Otwórz</button>
      <div class="spinner"></div>
    </div>
    <div class="case" data-price="20">
      <h2>Skrzynka 3 – 20 zł</h2>
      <button class="open-btn">Otwórz</button>
      <div class="spinner"></div>
    </div>
  </div>

  <div class="inventory">
    <h2>Ekwipunek</h2>
    <ul id="inventory-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
