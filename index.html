<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>HazardCS – Symulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h1>HazardCS</h1>
    <div class="nav-links">
      <button onclick="showSection('cases')">Skrzynki</button>
      <button onclick="showSection('upgrader')">Upgrader</button>
      <button onclick="showSection('inventory')">Ekwipunek</button>
      <button onclick="showSection('codes')">Kody</button>
    </div>
    <div class="wallet">💰 <span id="wallet">0.00</span> zł</div>
  </div>

  <div class="section" id="cases-section">
    <div class="cases">
      <div class="case-card" data-price="2">
        <img src="img/case1.png" alt="Skrzynka 1">
        <h3>Skrzynka 1</h3>
        <p>2 zł</p>
      </div>
      <div class="case-card" data-price="10">
        <img src="img/case2.png" alt="Skrzynka 2">
        <h3>Skrzynka 2</h3>
        <p>10 zł</p>
      </div>
      <div class="case-card" data-price="20">
        <img src="img/case3.png" alt="Skrzynka 3">
        <h3>Skrzynka 3</h3>
        <p>20 zł</p>
      </div>
    </div>
  </div>

  <div class="section" id="upgrader-section" style="display:none;">
    <h2>Upgrader</h2>
    <p>Wymień skiny na lepsze z szansą sukcesu opartą na cenie!</p>
  </div>

  <div class="section" id="inventory-section" style="display:none;">
    <h2>Ekwipunek</h2>
    <ul id="inventory-list"></ul>
  </div>

  <div class="section" id="codes-section" style="display:none;">
    <h2>Użyj kodu promocyjnego</h2>
    <input type="text" id="code-input" placeholder="Wpisz kod...">
    <button id="redeem-code">Użyj kodu</button>
  </div>

  <!-- Modal -->
  <div id="case-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" onclick="closeCaseModal()">&times;</span>
      <h2 id="modal-title">Skrzynka</h2>
      <div class="spinner" id="spinner"></div>
      <button id="open-case-btn">Otwórz skrzynkę</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
